# ============================================================================
# Bring Your Own Device (BYD) demo session.
# Top-level intro + a list of confirmed demos.
# ============================================================================

intro: >
  Bring Your Own Device (BYD) is a hands-on demo session where
  presenters bring functional wearable ultrasound systems. Modus:
  10' per demo (maximum 5 slides + live demo), then 2' change-over
  to the next station. A timekeeper enforces the cadence. The session
  runs Monday afternoon, preceded by a build-up and preparation slot.

# Session sponsor. Logo path is relative to the conference root
# because the page sets <base href=".."> in the chrome <head>.
sponsor:
  label: BYD session sponsored by
  name:  ETH Zurich Future Computing Lab
  logo:  assets/logo-efcl-400.png
  url:   https://efcl.ethz.ch/

demos:
