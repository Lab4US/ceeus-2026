# ============================================================================
# Bring Your Own Device (BYOD) demo session.
# Top-level intro + a list of confirmed demos.
# ============================================================================

intro: >
  Bring Your Own Device (BYOD) is a hands-on demo session for working
  wearable ultrasound hardware. Presenters bring functional systems;
  attendees interact with each one directly. Two slots: a shorter Part 1
  (2 demos) and a longer Part 2 (6 demos) on Monday afternoon.

# Session sponsor. Logo path is relative to the conference root
# because the page sets <base href=".."> in the chrome <head>.
sponsor:
  label: BYO Device session sponsored by
  name:  ETH Zurich Future Computing Lab
  logo:  assets/logo-efcl-400.png
  url:   https://efcl.ethz.ch/

demos:
  - title: PMUT/CMUT live demo — plug-&-play MUT demo for ToF systems and different phantoms
    presenters: Chris Stoeckel
    affiliation: Fraunhofer Institute for Electronic Nano Systems, Germany

  - title: Non-invasive Human-Machine Interfaces
    presenters: Bruno Grandi Sgambato
    affiliation: Imperial College London, UK

  - title: ModulUS - A Sandbox for Wearable Ultrasound System Development
    presenters: Marco Giordano, Marc-André Wessner, Michele Magno, Luca Benini, Christoph Leitner
    affiliation: ETH Zürich, Switzerland

  - title: Coded Excitation on Commercial Off-The-Shelf Microcontroller Platforms for Ultrasound Wearables
    presenters: Nele Kirsch, Alessandra Vignoli, Franz Richter, Richard Nauber, Erik Kaiser, Tönnis Trittler, Moritz Herzog
    affiliation: TU Dresden, Germany

  - title: WULPUS live demo - Real-Time Wearable Ultrasound for Virtual Reality Interaction
    presenters: Giusy Spacone, Sebastian Frey, Luca Benini, Andrea Cossettini
    affiliation: ETH Zürich, Switzerland

  - title: TinyProbe — Real-time Data Visualization in an Open, Wearable, 32-channel, Wireless Ultrasound Probe
    presenters: Cedric Hirschi, Federico Villani, Luca Benini, Andrea Cossettini
    affiliation: ETH Zürich, Switzerland

  - title: SonoTrak
    presenters: Erica L. King, Ahmed Bashatah, Abhishek Aher, Rahul Kaliki, Siddhartha Sikdar, Parag V. Chitnis
    affiliation: George Mason University & Myokinetics, Inc., USA

  - title: Hybrid Single Crystal – CMUT Stack for Wearable Ultrasound Applications
    presenters: Tönnis Trittler
    affiliation: TU Dresden, Germany

  - title: Ultrasonic Monitoring of Hip Joint Prostheses Osteointegration Monitoring
    presenters: Jan Lützelberger
    affiliation: Coburg University of Applied Sciences and Arts, Germany
