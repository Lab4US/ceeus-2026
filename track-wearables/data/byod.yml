    presenters: Bruno Grandi Sgambato
    affiliation: Imperial College London, UK

  - title: ModulUS - A Sandbox for Wearable Ultrasound System Development
    presenters: Marco Giordano, Marc-André Wessner, Michele Magno, Luca Benini, Christoph Leitner
    affiliation: ETH Zurich, CH

  - title: Coded Excitation on Commercial Off-The-Shelf Microcontroller Platforms for Ultrasound Wearables
    presenters: Nele Kirsch, Alessandra Vignoli, Franz Richter, Richard Nauber, Erik Kaiser, Tönnis Trittler, Moritz Herzog
    affiliation: TU Dresden, GER

  - title: WULPUS live demo - Real-Time Wearable Ultrasound for Virtual Reality Interaction
