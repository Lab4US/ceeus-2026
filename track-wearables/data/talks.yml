# ============================================================================
# Scientific talks. One YAML list item per talk.
#
# Required fields:
#   day:      Mon | Tue | Wed
#   session:  must match a talk-session title in schedule.yml on the same day
#             (e.g. "Transducers 1", "Signals & Systems", "Applications 2")
#   order:    1-based integer position within the session
#   title, speaker, affiliation
#
# Optional:
#   time:     left as "TBA" until per-talk slots are finalised
#   abstract: empty string renders as "Abstract not yet available."
#
# To reorder a session: change the `order:` integers - entries can stay in
# any order in this file.
# To move a talk between sessions: edit `session:` (and `day:` if needed).
# ============================================================================

