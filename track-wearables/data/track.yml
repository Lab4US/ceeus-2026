title:    Wearable Track

tagline:  Wearable ultrasound from transducers and acoustic stacks to
          embedded signal processing, system integration, and clinical
          translation. Three days of scientific talks, hands-on workshops,
          live BYO Device demos, lab secrets, and a discussion on
          forming a Special Interest Group for the field.

dates:    22–24 June 2026
