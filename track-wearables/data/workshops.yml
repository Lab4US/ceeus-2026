- title: "Polymer-Based Micromachined Transducers for Wearable Ultrasound: Design, Integration, and Performance Evaluation"
  day: Mon 22 Jun
  duration: 100 min · 13:00–14:40
  abstract: Wearable ultrasound enables continuous, non-invasive monitoring but is often constrained by transducer size, power consumption, and integration complexity. Polymer-based micromachined ultrasonic transducers (polyCMUTs) can address these challenges through miniaturization, design versatility, power efficiency and scalable fabrication. This workshop covers the design, integration, and evaluation of polyCMUTs for wearable systems, including acoustic field simulations, fabrication, packaging, and performance analysis. Emphasis is placed on the interpretation of impedance spectroscopy and hydrophone data, closing the loop to the initial predictions. Examples of current applications and associated challenges will be presented and discussed to provide attendees with a comprehensive overview of in-house ultrasound wearable design. 
  speakers:
    - name: Martin Angerer
      title: Dr.
      affiliation: University of British Columbia, CA
      photo: assets/wearable/WS-MartinAngerer.jpg
    - name: Jonas Welsch
      title: ""
      affiliation: University of British Columbia, CA
      photo: assets/wearable/WS-JonasWelsch.jpg

- title: "Anatomy of a Wearable Ultrasound System: From Components to Signals."
  day: Tue 23 Jun
  duration: 80 min · 14:00–15:20
  abstract: This workshop dissects a wearable ultrasound system from front-end components to digitized signals, to expose where energy is actually spent and for what. Through a live acquisition on the ModulUS platform and a hands-on Google Colab exploration of the recorded RF and envelope data, attendees will see why receive-channel scaling must be approached carefully in wearable ultrasound. Attendees are asked to bring their laptop to the workshop.
  speakers:
    - name: Christoph Leitner
      title: Dr.
      affiliation: ETH Zurich, CH
      photo: assets/wearable/WS-ChristophLeitner.jpg
    - name: Marco Giordano
      title: ""
      affiliation: ETH Zurich, CH
      photo: assets/wearable/WS-MarcoGiordano.jpg

- title: Live Imaging - Hands-on Medical Ultrasound
  day: Wed 24 Jun
  duration: 60 min · 13:40–14:40
  abstract: Developing next-generation wearable ultrasound patches requires a solid grasp of how devices interact with human anatomy in practice. This hands-on workshop bridges the gap between technical design and clinical application for engineers and developers, offering every participant the chance to perform ultrasound scans himself.Moving beyond standard B-mode structural scans, participants will gain direct experience with modalities critical for wearable monitoring like dynamic M-mode imaging for lung tracking or Doppler measurements for fluid flow velocity. By scanning firsthand, attendees will experience the physical realities of acoustic coupling and motion artifacts, gaining vital insights into variables that directly impact signal processing and algorithm design.
  speakers:
    - name: Moritz Herzog
      title: Dr.
      affiliation: TU Dresden, DE
      photo: assets/wearable/WS-MoritzHerzog.jpg
