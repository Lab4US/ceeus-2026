- title: "Polymer-Based Micromachined Transducers for Wearable Ultrasound: Design, Integration, and Performance Evaluation"
  day: Mon 22 Jun
  duration: 100 min · 13:00–14:40
  abstract: |
    Wearable ultrasound enables continuous, non-invasive monitoring but is
    often constrained by transducer size, power consumption, and integration
    complexity. Polymer-based micromachined ultrasonic transducers (polyCMUTs)
    can address these challenges through miniaturization, design versatility,
    power efficiency and scalable fabrication.

    This workshop covers the design, integration, and evaluation of polyCMUTs
    for wearable systems, including acoustic field simulations, fabrication,
    packaging, and performance analysis. Emphasis is placed on the
    interpretation of impedance spectroscopy and hydrophone data, closing the
    loop to the initial predictions.

    Examples of current applications and associated challenges will be
    presented and discussed to provide attendees with a comprehensive
    overview of in-house ultrasound wearable design.
  speakers:
