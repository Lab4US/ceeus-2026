# ============================================================================
# Session-type palette. Each top-level key is referenced by 'type:' in
# schedule.yml and rendered as a colored pill in the program table.
# Hex colors MUST be quoted - an unquoted '#' starts a YAML comment.
# ============================================================================

talk:
  label: Talk
  color: "#4a7bb7"

byod:
  label: BYD
  color: "#c6802e"

workshop:
  label: Workshop
  color: "#5a8a4a"

sig:
  label: SIG
  color: "#8a4a8c"

labsecret:
  label: Lab Secret
  color: "#3a3a3a"

break:
  label: Break
  color: "#b0b0b0"
