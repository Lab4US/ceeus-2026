# ============================================================================
# Program grid for the Wearable Track. Top-level is a list of days.
# Each day has a list of sessions. Field 'type' must match a key in
# session-types.yml (talk | byod | workshop | sig | labsecret | break).
#
# Scientific-talk sessions may have a `chairs:` list (1-2 entries). Shape
# matches track.yml chairs:
#   chairs:
#     - name:        Alice Example
#       affiliation: ETH Zurich     # optional
#       email:       alice@x.org    # optional, becomes mailto link
# The full title "Scientific Presentations - X" is shown in this grid.
# In the Talks section the prefix is stripped automatically, so the
# session: field in talks.yml only needs to carry the bare topic
# (e.g. "Transducers 1").
# ============================================================================

