# ============================================================================
# "Lab Secrets" informal session.
# Each entry under 'secrets:' is one short talk inside the session.
# ============================================================================

title: Lab Secrets
when:  Tue 23 Jun · 11:40–12:40 + 13:40–14:00

teaser: >
  An informal swap of tricks of the trade. Each researcher brings one lab secret that
  took months to figure out - a method, a bench hack, a measurement trick - and shares it with the room.

secrets:
  - title: Coded Signals
    teaser: The employment of coded signals offers great potential for ultrasonic imaging and sensing, as Signal-to-Noise ratio can be improved significantly. However, it requires advanced signal processing, and the raw signal can be cryptic to interpret. We’ll show you our tricks how to overcome this and help you unlock the power of coded signals in your lab. 
    presenter:   Tönnis Trittler
    affiliation: TU Dresden, DE
    photo:       assets/wearable/WS-ToennisTrittler.jpg

  - title: From Echoes to Embedded Intelligence 
    teaser: Explore how to bring real-time musculoskeletal system monitoring into wearable devices, from classic signal-processing pipelines to on-device machine learning deployment.
    presenter:   Giusy Spacone
    affiliation: ETH Zurich, CH
    photo:       assets/wearable/WS-GiusySpacone.jpg

  - title: S11 Measurements
    teaser: Accurate S11 measurements are often harder than they look, especially once cables, fixtures, and mounting conditions start influencing the result more than the transducer itself. Federico Villani will share his insights into S11 measurements and practical lab routines that help obtain reliable, reproducible impedance measurements without turning every experiment into a debugging session.
    presenter:   Federico Villani
    affiliation: ETH Zurich, CH
    photo:       assets/wearable/WS-FedericoVillani.jpg

  - title: Designing Human-Participant Experiments for Ultrasound Human-Machine Interfaces
    teaser: In this short session we will share practical lessons on designing and evaluating human-participant experiments for ultrasound-based human-machine interfaces. We will focus on how choices in data collection, labelling, protocol design, and model validation shape our conclusions and highlight pitfalls and trade-offs that commonly arise.
    presenter:   Bruno Grandi Sgambato
    affiliation: Imperial College London, GB
    photo:       assets/wearable/WS-BrunoSgambato.jpg
